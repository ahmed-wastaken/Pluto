<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="../../components/pluto-favicon.png">
  <title>Demo: Delta Line Construction | Pluto</title>
  <!-- Tailwind CSS for responsive utilities -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Pluto Design System Tokens */
    :root {
      --bg: #ffffff;
      --bg2: #f7f6fd;
      --tx: #14102b;
      --mu: #5d5a78;
      --bd: #e7e4f5;
      --card: #ffffff;
      --p: #7b68ee;
      --g: linear-gradient(120deg, #7b68ee, #ff02f0 70%, #ffc800);
      --bubble-bg: rgba(255, 255, 255, 0.88);
      --bubble-tx: #14102b;
      --bubble-bd: rgba(231, 228, 245, 0.9);
      --switch-bg: #ece9fa;
      --shadow-primary: 0 10px 28px rgba(123, 104, 238, 0.35);
      --shadow-float: 0 20px 50px rgba(123, 104, 238, 0.28), 0 4px 18px rgba(20, 16, 43, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0b1f;
        --bg2: #15112e;
        --tx: #f3f1ff;
        --mu: #a9a5c8;
        --bd: #2a2550;
        --card: #1a1538;
        --bubble-bg: rgba(20, 16, 43, 0.88);
        --bubble-tx: #f3f1ff;
        --bubble-bd: rgba(123, 104, 238, 0.28);
        --switch-bg: #15112e;
        --shadow-primary: 0 10px 28px rgba(123, 104, 238, 0.45);
        --shadow-float: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 35px rgba(123, 104, 238, 0.3);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0e0b1f;
      --bg2: #15112e;
      --tx: #f3f1ff;
      --mu: #a9a5c8;
      --bd: #2a2550;
      --card: #1a1538;
      --bubble-bg: rgba(20, 16, 43, 0.88);
      --bubble-tx: #f3f1ff;
      --bubble-bd: rgba(123, 104, 238, 0.28);
      --switch-bg: #15112e;
      --shadow-primary: 0 10px 28px rgba(123, 104, 238, 0.45);
      --shadow-float: 0 24px 60px rgba(0, 0, 0, 0.65), 0 0 35px rgba(123, 104, 238, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Pluto Gradient Button */
    .btn-pluto {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      line-height: 1;
      background: var(--g);
      background-size: 200% 100%;
      color: #ffffff !important;
      transition: all 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
      box-shadow: var(--shadow-primary);
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      border: none;
    }

    .btn-pluto:hover {
      background-position: 100% 0;
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255, 2, 240, 0.4);
    }

    .btn-pluto:active {
      transform: translateY(0);
    }

    /* Back Button with Pluto underline highlight effect */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      color: var(--bubble-tx);
      border: 1.5px solid var(--bubble-bd);
      background: rgba(255, 255, 255, 0.04);
      transition: all 0.25s ease;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn-back svg {
      transition: transform 0.25s ease;
      stroke: currentColor;
    }

    .btn-back:hover {
      border-color: var(--p);
      color: var(--p);
      transform: translateX(-3px);
      background: rgba(123, 104, 238, 0.08);
    }

    .btn-back:hover svg {
      transform: translateX(-3px);
    }

    /* Floating Bubble Container */
    .floating-bubble {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom, 16px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: max-content;
      max-width: min(94vw, 840px);
      background: var(--bubble-bg);
      border: 1px solid var(--bubble-bd);
      border-radius: 22px;
      box-shadow: var(--shadow-float);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 12px;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    /* Info Badge / Demo Disclaimer */
    .demo-disclaimer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      line-height: 1.25;
      color: #8f8ba8;
      font-weight: 450;
      max-width: 270px;
      text-align: left;
    }

    @media (prefers-color-scheme: dark) {
      .demo-disclaimer {
        color: #9d99bd;
      }
    }

    .info-icon {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border-radius: 5px;
      background: rgba(123, 104, 238, 0.12);
      color: var(--p);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      font-style: italic;
      font-family: serif;
    }

    /* Segmented Sliding Control */
    .segmented-control {
      position: relative;
      display: flex;
      background: var(--switch-bg);
      border-radius: 12px;
      padding: 3px;
      border: 1px solid var(--bd);
      user-select: none;
      width: 148px;
      height: 34px;
      flex-shrink: 0;
    }

    .switch-indicator {
      position: absolute;
      top: 3px;
      left: 3px;
      width: calc(50% - 3px);
      height: calc(100% - 6px);
      border-radius: 9px;
      background: var(--g);
      box-shadow: 0 4px 14px rgba(123, 104, 238, 0.4);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 1;
    }

    .segmented-control[data-active="old"] .switch-indicator {
      transform: translateX(0%);
    }

    .segmented-control[data-active="new"] .switch-indicator {
      transform: translateX(100%);
    }

    .switch-btn {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      color: var(--mu);
      background: transparent;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: color 0.25s ease;
      outline: none;
    }

    .switch-btn.active {
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }

    /* Viewport Iframe Layers */
    .view-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      transition: opacity 0.45s cubic-bezier(0.2, 0.7, 0.2, 1),
                  transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1),
                  visibility 0.45s;
    }

    .view-layer.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
      z-index: 10;
    }

    .view-layer.inactive {
      opacity: 0;
      visibility: hidden;
      transform: scale(0.985);
      pointer-events: none;
      z-index: 5;
    }

    /* Small badge at top right to clearly indicate state without interfering */
    .status-badge {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 40;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--bubble-bg);
      border: 1px solid var(--bubble-bd);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(20, 16, 43, 0.12);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--tx);
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .status-badge .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--p);
      box-shadow: 0 0 10px var(--p);
    }


    /* Desktop floating navigation */
    .bubble-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .bubble-center { display: inline-flex; align-items: center; gap: 10px; }
    .bubble-actions { display: contents; }
    .demo-disclaimer { order: 2; }
    #backBtnPlaceholder { order: 1; }
    .segmented-control { order: 3; }
    #letsTalkBtn { order: 4; }

    /* Mobile: independent disclaimer and control rows */
    @media (max-width: 767px) {
      .floating-bubble {
        left: 12px;
        right: 12px;
        bottom: max(10px, env(safe-area-inset-bottom));
        transform: none;
        width: auto;
        max-width: none;
        padding: 11px 12px 10px;
        border-radius: 18px;
      }
      .bubble-row {
        display: flex !important;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 10px;
        width: 100%;
      }
      .demo-disclaimer {
        display: flex;
        align-items: flex-start;
        gap: 7px;
        width: 100%;
        max-width: none;
        min-width: 0;
        font-size: 12px;
        line-height: 1.4;
        text-align: left;
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .demo-disclaimer .info-icon { margin-top: 1px; }
      .bubble-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 6px;
        width: 100%;
        min-width: 0;
      }
      #backBtnPlaceholder {
        grid-column: 1;
        justify-self: start;
        min-width: 0;
        padding: 9px 10px !important;
        gap: 6px;
        font-size: 12px !important;
      }
      .bubble-center {
        display: contents;
      }
      .segmented-control {
        grid-column: 2;
        justify-self: center;
        width: 112px !important;
        height: 36px;
        margin: 0;
      }
      .switch-btn { font-size: 11px; gap: 3px; }
      .switch-btn svg { width: 11px; height: 11px; }
      #letsTalkBtn {
        grid-column: 3;
        justify-self: end;
        min-width: 0;
        padding: 10px 11px !important;
        font-size: 12px !important;
      }
      #letsTalkBtn svg { display: none; }
    }

    @media (max-width: 360px) {
      .floating-bubble { left: 8px; right: 8px; padding: 10px; }
      .bubble-row { gap: 8px; }
      .bubble-actions { gap: 3px; }
      #backBtnPlaceholder { padding: 8px 8px !important; }
      .segmented-control { width: 104px !important; }
      #letsTalkBtn { padding: 9px 8px !important; }
    }
  </style>
</head>
<body>

  <!-- STATUS BADGE: Visual feedback for active mode -->
  <div class="status-badge" id="statusBadge">
    <span class="indicator-dot" id="statusDot"></span>
    <span id="statusText">Viewing: New Website</span>
  </div>

  <!-- ========================================================
       IFRAME 1: OLD WEBSITE LAYER (Before)
       ======================================================== -->
  <iframe 
    id="iframeOld" 
    class="view-layer inactive"
    title="Old Website Version"
    sandbox="allow-scripts allow-same-origin allow-forms"
    src="http://www.deltaline.org/index.html">
  </iframe>

  <!-- ========================================================
       IFRAME 2: NEW WEBSITE LAYER (After - Default View)
       ======================================================== -->
  <iframe 
    id="iframeNew" 
    class="view-layer active"
    title="New Website Redesign"
    sandbox="allow-scripts allow-same-origin allow-forms"
    src="Delta Line Construction/index.html">
  </iframe>

  <!-- FLOATING BUBBLE NAVIGATION BAR -->
  <aside class="floating-bubble" aria-label="Showcase Controls Navigation">
    <div class="bubble-row">
      <div class="demo-disclaimer">
        <span class="info-icon" aria-hidden="true">i</span>
        <span>This is a demo website designed to showcase our capabilities.</span>
      </div>
      <div class="bubble-actions">
        <a href="../../our_work.html" id="backBtnPlaceholder"
          data-placeholder-url="/* REPLACE_BACK_URL */"
          class="btn-back !py-1.5 !px-3 !text-xs !rounded-[12px]"
          title="Return to previous page">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back</span>
        </a>
        <div class="segmented-control" id="toggleControl" data-active="new"
          role="radiogroup" aria-label="Website Version Selector">
          <div class="switch-indicator" aria-hidden="true"></div>
          <button type="button" id="btnSelectOld" class="switch-btn" role="radio" aria-checked="false">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
            </svg>Old
          </button>
          <button type="button" id="btnSelectNew" class="switch-btn active" role="radio" aria-checked="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>New
          </button>
        </div>
        <a href="../../contact-us.html" id="letsTalkBtn"
          data-placeholder-url="/* REPLACE_CONTACT_US_URL */"
          class="btn-pluto !py-2 !px-3.5 !text-xs !rounded-[12px]"
          title="Start a project with Pluto">
          <span>Let's Talk</span>
          <svg class="ml-1.5 w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- Control & Toggle Logic -->
  <script>
    /**
     * Pluto Showcase Controller
     * Handles switching between Old & New full-screen iframes
     * and maintains accessible states and responsive feedback.
     */
    (function initShowcase() {
      const toggleControl = document.getElementById('toggleControl');
      const btnSelectOld = document.getElementById('btnSelectOld');
      const btnSelectNew = document.getElementById('btnSelectNew');
      
      const iframeOld = document.getElementById('iframeOld');
      const iframeNew = document.getElementById('iframeNew');
      
      const statusBadge = document.getElementById('statusBadge');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      // State variable: 'new' is default according to requirements
      let currentView = 'new';

      function updateView(mode) {
        if (mode === currentView && toggleControl.getAttribute('data-active') === mode) {
          return;
        }
        currentView = mode;

        if (mode === 'old') {
          // Switch segmented control visual state
          toggleControl.setAttribute('data-active', 'old');
          btnSelectOld.classList.add('active');
          btnSelectOld.setAttribute('aria-checked', 'true');
          btnSelectNew.classList.remove('active');
          btnSelectNew.setAttribute('aria-checked', 'false');

          // Switch active iframe layer
          iframeNew.classList.remove('active');
          iframeNew.classList.add('inactive');
          iframeOld.classList.remove('inactive');
          iframeOld.classList.add('active');

          // Update Status pill
          statusText.textContent = 'Viewing: Old Website';
          statusDot.style.background = '#888899';
          statusDot.style.boxShadow = '0 0 8px #888899';
        } else {
          // Mode: 'new'
          toggleControl.setAttribute('data-active', 'new');
          btnSelectNew.classList.add('active');
          btnSelectNew.setAttribute('aria-checked', 'true');
          btnSelectOld.classList.remove('active');
          btnSelectOld.setAttribute('aria-checked', 'false');

          // Switch active iframe layer
          iframeOld.classList.remove('active');
          iframeOld.classList.add('inactive');
          iframeNew.classList.remove('inactive');
          iframeNew.classList.add('active');

          // Update Status pill
          statusText.textContent = 'Viewing: New Website';
          statusDot.style.background = '#7b68ee';
          statusDot.style.boxShadow = '0 0 10px #7b68ee';
        }
      }

      // Attach click listeners to segmented toggle buttons
      btnSelectOld.addEventListener('click', () => updateView('old'));
      btnSelectNew.addEventListener('click', () => updateView('new'));

      // Keyboard arrow navigation support for switch (Left/Right arrow keys)
      toggleControl.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          updateView('old');
          btnSelectOld.focus();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          updateView('new');
          btnSelectNew.focus();
        }
      });

      // Quick keyboard shortcut (Tab or key 'o' / 'n') for demo presenters
      window.addEventListener('keydown', (e) => {
        // Only if target is not an input
        if (['INPUT', 'TEXTAREA'].includes(e.target.tagName)) return;
        if (e.key.toLowerCase() === 'o') updateView('old');
        if (e.key.toLowerCase() === 'n') updateView('new');
      });
    })();
  </script>
</body>
</html>
