<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="components/pluto-favicon.png">
  <title>Form Responses | Pluto</title>
  <style>
    :root {
      --bg: #fff;
      --tx: #14102b;
      --bd: #e7e4f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0b1f;
        --tx: #f3f1ff;
        --bd: #2a2550;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--tx);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    /* Enables the sticky nav + full-screen iframe + footer layout */
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Container fills all available viewport height between nav and footer */
    .app-frame-container {
      flex: 1 1 auto;
      width: 100%;
      display: flex;
      background: var(--bg);
    }

    .app-frame-container iframe {
      width: 100%;
      height: 100%;
      min-height: calc(100vh - 140px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- NAV: first thing inside <body> -->
  <script src="components/layout.js" data-part="nav"></script>

  <!-- Full-screen iframe container -->
  <main class="app-frame-container">
    <iframe 
      src="https://script.google.com/a/macros/etaacademy.org/s/AKfycbyJCHOVBUoPzTyV8VfsxkzsDyjq3aN59wXIL6J-kr3amg1g9d6Su0vtYJ9Ubjt6ecEL/exec?page=admin" 
      allow="fullscreen; clipboard-read; clipboard-write"
      loading="lazy">
    </iframe>
  </main>

  <!-- FOOTER: last thing before closing body -->
  <script src="components/layout.js" data-part="footer"></script>

</body>
</html>
